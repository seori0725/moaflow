<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="모아플로 학원 운영: 학원 관리, 학부모 성장 확인, 운영 지표와 오류·문의 관리"
    />
    <title>MoaFlow · 운영자 기능 완성</title>
    <link rel="stylesheet" href="./styles.css?v=20260818-02" />
  </head>
  <body>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <main id="auth-screen" class="auth-screen">
      <section class="auth-story">
        <div class="auth-brand-lockup">
          <a class="brand brand-light" href="#" aria-label="모아플로 홈">
            <svg class="brand-symbol" viewBox="0 0 60 56" aria-hidden="true">
              <path d="M8 48 L8 14 Q8 9 13 12 L30 30 L47 12 Q52 9 52 14 L52 48"></path>
              <path d="M30 30 L30 48 M30 30 L48 30"></path>
            </svg>
            <span><i>Moa</i>Flow</span>
          </a>
          <p>학원을 간편하게 운영하고<br />학부모와 자녀의 출결·학습 현황을 공유하며 소통하세요.</p>
        </div>
      </section>

      <section class="auth-panel">
        <div class="auth-card">
          <div id="auth-role-step">
            <h2>모아플로 시작하기</h2>
            <div class="role-options" role="radiogroup" aria-label="로그인 역할">
              <button class="role-option active" data-auth-role="academy_owner" role="radio" aria-checked="true">
                <svg class="role-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-5h6v5M12 4V1m0 0 4 2-4 2" /></svg>
                <strong>학원 원장</strong>
              </button>
              <button class="role-option" data-auth-role="academy_instructor" role="radio" aria-checked="false">
                <svg class="role-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-2a4 4 0 0 1 4-4h2M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm6-7h7v10h-7m3-5-3 3" /></svg>
                <strong>학원 강사</strong>
              </button>
              <button class="role-option" data-auth-role="guardian" role="radio" aria-checked="false">
                <svg class="role-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8-1a3 3 0 1 0 0-6m-14 17v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2m3-7a5 5 0 0 1 5 5v2" /></svg>
                <strong>학부모</strong>
              </button>
            </div>
            <button id="continue-to-phone" class="button primary block">휴대전화로 계속하기</button>
            <div class="operator-login-row">
              <button type="button" class="operator-login-link" data-auth-role="operator" data-auth-direct="true">운영자 로그인</button>
            </div>
          </div>

          <form id="auth-phone-step" class="hidden">
            <button type="button" id="back-to-role" class="text-button back-button">← 로그인 유형 변경</button>
            <p class="eyebrow">PHONE VERIFY</p>
            <h2 id="auth-form-title">학원 시작하기</h2>
            <p class="supporting">대표자 또는 담당자 휴대전화로 인증합니다.</p>
            <label for="phone">휴대전화 번호</label>
            <div class="inline-field">
              <input id="phone" name="phone" inputmode="numeric" autocomplete="tel" value="010-1234-5678" />
              <button type="button" id="request-code" class="button secondary">인증 요청</button>
            </div>
            <div id="verification-wrap" class="hidden">
              <div class="verification-meta">
                <label for="verification-code">인증번호</label>
                <span id="verification-timer">02:59</span>
              </div>
              <input
                id="verification-code"
                name="verification-code"
                inputmode="numeric"
                maxlength="6"
                placeholder="6자리 인증번호"
                autocomplete="one-time-code"
              />
              <p class="field-hint">데모 인증번호는 <strong>123456</strong>입니다.</p>
              <button type="submit" class="button primary block">인증하고 계속하기</button>
            </div>
          </form>
        </div>
        <p class="auth-policy">인증을 계속하면 서비스 이용약관과 개인정보 처리방침에 동의한 것으로 봅니다.</p>
      </section>
    </main>

    <main id="workspace" class="workspace hidden">
      <aside class="sidebar">
        <a class="brand" href="#" data-view-target="home" aria-label="모아플로 홈">
          <svg class="brand-symbol" viewBox="0 0 60 56" aria-hidden="true">
            <path d="M8 48 L8 14 Q8 9 13 12 L30 30 L47 12 Q52 9 52 14 L52 48"></path>
            <path d="M30 30 L30 48 M30 30 L48 30"></path>
          </svg>
          <span><i>Moa</i>Flow</span>
        </a>

        <div class="workspace-context">
          <span id="context-label">ACADEMY</span>
          <strong id="context-name">에듀수학학원</strong>
          <small id="context-detail">등록 학원 수 0</small>
        </div>

        <nav id="main-nav" class="main-nav" aria-label="주 메뉴"></nav>
      </aside>

      <section class="workspace-main">
        <header class="topbar">
          <button id="mobile-nav-toggle" class="icon-button mobile-only" aria-label="메뉴 열기">☰</button>
          <div>
            <h1 id="page-title">공통 기반 현황</h1>
          </div>
          <div class="account-menu">
            <div class="account-avatar" id="account-avatar">한</div>
            <div class="account-copy">
              <strong id="account-name">한도담</strong>
            </div>
            <button id="sign-out" class="button tertiary compact">로그아웃</button>
          </div>
        </header>

        <div id="view-root" class="view-root"></div>
      </section>
    </main>

    <div id="modal-backdrop" class="modal-backdrop hidden" aria-hidden="true">
      <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
    </div>

    <div id="qa-mode-banner" class="qa-mode-banner hidden" role="status"></div>
    <script src="./payments.js?v=20260818-02"></script>
    <script src="./qa-data.js?v=20260818-02"></script>
    <script src="./app.js?v=20260818-02"></script>
  </body>
</html>
